name: Deploy templates to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            basic/package-lock.json
            jquery/package-lock.json
            typescript/package-lock.json

      - name: Build basic template
        working-directory: basic
        run: |
          npm ci
          npm run build

      - name: Build jQuery template
        working-directory: jquery
        run: |
          npm ci
          npm run build

      - name: Build TypeScript template
        working-directory: typescript
        run: |
          npm ci
          npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p public/basic public/jquery public/typescript
          cp -R basic/dist/. public/basic/
          cp -R jquery/dist/. public/jquery/
          cp -R typescript/dist/. public/typescript/
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Webpack Boilerplates</title>
              <style>
                body {
                  margin: 0;
                  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                  color: #1f2937;
                  background: #f8fafc;
                }

                main {
                  width: min(720px, calc(100% - 32px));
                  margin: 64px auto;
                }

                h1 {
                  margin: 0 0 12px;
                  font-size: 32px;
                }

                p {
                  margin: 0 0 24px;
                  color: #4b5563;
                }

                ul {
                  display: grid;
                  gap: 12px;
                  padding: 0;
                  list-style: none;
                }

                a {
                  display: block;
                  padding: 16px;
                  color: #111827;
                  text-decoration: none;
                  background: #fff;
                  border: 1px solid #e5e7eb;
                  border-radius: 8px;
                }

                a:hover {
                  border-color: #9ca3af;
                }
              </style>
            </head>
            <body>
              <main>
                <h1>Webpack Boilerplates</h1>
                <p>Built template previews.</p>
                <ul>
                  <li><a href="./basic/">Basic</a></li>
                  <li><a href="./jquery/">jQuery</a></li>
                  <li><a href="./typescript/">TypeScript</a></li>
                </ul>
              </main>
            </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
